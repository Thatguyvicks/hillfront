<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilldash | Worker Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;
            --radius: 12px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }

        aside {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: fixed;
            height: 100vh;
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 8px; }
        
        nav { flex: 1; }
        nav a { 
            display: flex; align-items: center; padding: 12px 16px; 
            text-decoration: none; color: var(--text-muted); 
            font-weight: 500; border-radius: 8px; margin-bottom: 4px; transition: 0.2s;
        }
        nav a.active { background: #eff6ff; color: var(--primary); }
        nav a:hover:not(.active) { background: #f1f5f9; color: var(--text-main); }

        main { flex: 1; margin-left: 260px; padding: 32px; max-width: 1400px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        header h1 { font-size: 1.5rem; font-weight: 700; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .stat-card span { color: var(--text-muted); font-size: 0.875rem; font-weight: 500; }
        .stat-card h2 { font-size: 1.75rem; margin-top: 8px; font-weight: 700; }

        .card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 24px; overflow: hidden; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 1.1rem; font-weight: 600; }

        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 14px 24px; background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
        td { padding: 16px 24px; border-top: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-pending_courier { background: #e0f2fe; color: #075985; }
        .status-delivered { background: #dcfce7; color: #166534; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .status-out_for_delivery { background: #fae8ff; color: #701a75; }

        .btn-group { display: flex; gap: 8px; }
        button { padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: 0.2s; font-family: inherit; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline-danger { background: #fff; border-color: #fee2e2; color: var(--danger); }

        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

        .toast { 
            position: fixed; bottom: 32px; right: 32px; background: #1e293b; color: #fff; 
            padding: 16px 24px; border-radius: 10px; opacity: 0; transition: 0.4s; z-index: 9999;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; transform: translateY(-10px); }

        @media(max-width: 1024px) {
            aside { display: none; }
            main { margin-left: 0; padding: 20px; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside>
    <div class="logo">📦 Hilldash</div>
    <nav>
        <a href="#" class="active"><i class="ri-dashboard-line"></i> &nbsp;Dashboard</a>
        <a href="workprofile.html"><i class="ri-user-settings-line"></i> &nbsp;Settings</a>
    </nav>
    <div style="margin-top: auto; font-size: 0.8rem; color: var(--text-muted);">
        Worker Access <br><strong id="userMail" style="color: var(--text-main);">...</strong>
    </div>
</aside>

<main>
    <header>
        <div>
            <h1>Orders Queue</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Review and process incoming requests</p>
        </div>
        <div id="statusIndicator" style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; color: var(--success);">
            <div style="width: 8px; height: 8px; background: var(--success); border-radius: 50%;"></div> Connection Live
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <span>Daily Processed</span>
            <h2 id="revenueDay">₦0</h2>
        </div>
        <div class="stat-card">
            <span>Awaiting Action</span>
            <h2 id="pendingCountStat">0</h2>
        </div>
        <div class="stat-card">
            <span>Ready for Courier</span>
            <h2 id="acceptedToday">0</h2>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>📦 New Requests</h3>
            <span class="badge status-pending" id="badge">0 Pending</span>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Address</th>
                        <th>Order Details</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pendingList"></tbody>
            </table>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <div class="card-header"><h3>📊 Daily Output</h3></div>
            <div style="padding: 24px; height: 300px;">
                <canvas id="chart"></canvas>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><h3>📋 Processed History</h3></div>
            <div class="table-wrapper">
                <table>
                    <tbody id="historyList"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    const API = "https://hilldashcorp.onrender.com/api"; // CHANGE if needed

    const workerData = JSON.parse(localStorage.getItem("user")) || { email: "worker@mail.com" };
    document.getElementById("userMail").innerText = workerData.email;

    function toast(msg) {
        const t = document.createElement("div");
        t.className = "toast show";
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => { t.remove(); }, 3000);
    }

    function showError(message) {
        document.getElementById("pendingList").innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center; padding:40px; color:red;">
                    ${message}
                </td>
            </tr>`;
    }

    const ctx = document.getElementById('chart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            datasets: [{ 
                data: [0,0,0,0,0,0,0], 
                borderColor: '#2563eb', 
                backgroundColor: 'rgba(37, 99, 235, 0.1)', 
                fill: true,
                tension: 0.4 
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    async function processOrder(id, decision) {
        try {
            const res = await fetch(`${API}/orders/${id}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: decision })
            });

            if (!res.ok) throw new Error("Update failed");

            toast(decision === 'pending_courier' ? "Order accepted" : "Order rejected");
            loadOrders();

        } catch (e) {
            console.error(e);
            toast("Failed to update order");
        }
    }

    function syncStats(orders) {
        const todayStr = new Date().toDateString();
        let dayTotal = 0, readyForCourier = 0;
        let weeklyData = [0,0,0,0,0,0,0];

        orders.forEach(o => {
            const date = new Date(o.createdAt || Date.now());
            const amount = o.total || 0;

            const dayIndex = (date.getDay() + 6) % 7;
            weeklyData[dayIndex] += amount;

            if (date.toDateString() === todayStr) {
                if (o.status !== 'cancelled') dayTotal += amount;
                if (o.status === 'pending_courier') readyForCourier++;
            }
        });

        document.getElementById("revenueDay").innerText = `₦${dayTotal.toLocaleString()}`;
        document.getElementById("acceptedToday").innerText = readyForCourier;
        chart.data.datasets[0].data = weeklyData;
        chart.update();
    }

    async function loadOrders() {
        const list = document.getElementById("pendingList");

        // 🔄 Loading state
        list.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center; padding:40px; color:gray;">
                    Loading orders...
                </td>
            </tr>`;

        try {
            console.log("Fetching orders for:", workerData.email);

            const res = await fetch(`${API}/orders`);

            if (!res.ok) throw new Error("Server not responding");

            let orders = await res.json();

            console.log("All orders:", orders);

            // 🔥 IMPORTANT FIX: filter on frontend (safer)
            orders = orders.filter(o => o.assignedWorkerEmail === workerData.email);

            console.log("Filtered orders:", orders);

            // Pending
            const pending = orders.filter(o => o.status === "pending");

            document.getElementById("pendingCountStat").innerText = pending.length;
            document.getElementById("badge").innerText = `${pending.length} Pending`;

            list.innerHTML = pending.length ? "" : `
                <tr>
                    <td colspan="5" style="text-align:center; padding:40px; color:gray;">
                        No new orders
                    </td>
                </tr>`;

            pending.forEach(o => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${o.customerName}</strong></td>
                    <td style="max-width:200px;">${o.deliveryAddress}</td>
                    <td><small>${o.items?.map(i => `${i.quantity}x ${i.name}`).join(", ")}</small></td>
                    <td><strong>₦${(o.total || 0).toLocaleString()}</strong></td>
                    <td>
                        <button class="btn-primary" onclick="processOrder('${o._id}','pending_courier')">Accept</button>
                        <button class="btn-outline-danger" onclick="processOrder('${o._id}','cancelled')">Reject</button>
                    </td>`;
                list.appendChild(tr);
            });

            // History
            const historyList = document.getElementById("historyList");

            const history = orders
                .filter(o => o.status !== "pending")
                .sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt))
                .slice(0, 10);

            historyList.innerHTML = history.length ? "" : `
                <tr>
                    <td style="text-align:center; padding:20px; color:gray;">
                        No processed orders
                    </td>
                </tr>`;

            history.forEach(o => {
                const tr = document.createElement("tr");
                const label = o.status.replace(/_/g, ' ');
                tr.innerHTML = `
                    <td style="padding:16px 24px">
                        <div style="display:flex; justify-content:space-between;">
                            <div>
                                <strong>${o.customerName}</strong><br>
                                <small>ID: #${o._id.slice(-5)}</small>
                            </div>
                            <span class="badge status-${o.status}">${label}</span>
                        </div>
                    </td>`;
                historyList.appendChild(tr);
            });

            syncStats(orders);

        } catch (err) {
            console.error("ERROR:", err);
            showError("⚠️ Cannot connect to server. Check backend.");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadOrders();
        setInterval(loadOrders, 15000);
    });
</script>
</body>
</html>
