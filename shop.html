<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilldash | Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            color: var(--text-main);
            padding-bottom: 100px;
        }

        .header-section {
            background: var(--surface);
            padding: 20px 6%;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: var(--primary); 
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 48px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #f1f5f9;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .search-wrapper input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .section-label {
            padding: 24px 6% 12px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 0 6%;
        }

        .store-card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .store-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .store-img-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: #fdfdfd;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .store-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .store-info {
            padding: 12px;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        .store-info h3 {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .store-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: flex-end; 
            z-index: 1000;
        }

        .store-modal.show { display: flex; }

        .store-content {
            background: var(--surface);
            width: 100%;
            max-width: 550px;
            height: 80vh;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #storeTitle {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .store-products {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .item img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
        }

        .item-info { flex: 1; }
        .item-info h4 { font-size: 0.95rem; margin-bottom: 2px; }
        .item-info p { color: var(--primary); font-weight: 700; font-size: 0.9rem; }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
        }

        .qty-control button {
            width: 28px;
            height: 28px;
            border: none;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: var(--shadow-sm);
        }

        .add-cart-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 10px;
        }

        .floating-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            gap: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255,255,255,0.5);
            z-index: 999;
        }

        .nav-item { color: var(--text-muted); font-size: 1.5rem; }
        .nav-item.active { color: var(--primary); }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px; /* pill shape */
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            transition: 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

        @media(max-width: 480px) {
            .store-grid { grid-template-columns: repeat(2, 1fr); }
            .store-content { height: 85vh; }
        }
    </style>
</head>
<body>

<header class="header-section">
    <div class="logo">Hilldash</div>
    <div class="search-wrapper">
        <i class="ri-search-line"></i>
        <input type="text" id="searchInput" placeholder="Search for food or stores..." onkeyup="filterProducts()">
    </div>
</header>

<div class="section-label">Explore Stores</div>

<section class="store-grid">
    <div class="store-card" onclick="openStoreModal('burger')">
        <div class="store-img-box"><img src="burger king.png" alt="BK"></div>
        <div class="store-info"><h3>Burger King</h3></div>
    </div>
    <div class="store-card" onclick="openStoreModal('pizza')">
        <div class="store-img-box"><img src="pizza hut.png" alt="PH"></div>
        <div class="store-info"><h3>Pizza Hut</h3></div>
    </div>
    <div class="store-card" onclick="openStoreModal('kfc')">
        <div class="store-img-box"><img src="kfc.png" alt="KFC"></div>
        <div class="store-info"><h3>KFC</h3></div>
    </div>
    <div class="store-card" onclick="openStoreModal('chicken')">
        <div class="store-img-box"><img src="chicken repiblic.png" alt="CR"></div>
        <div class="store-info"><h3>Chicken Republic</h3></div>
    </div>
</section>

<div class="store-modal" id="storeModal">
    <div class="store-content">
        <button class="close-btn" onclick="closeStore()"><i class="ri-close-line"></i></button>
        <h2 id="storeTitle">Store</h2>
        <div class="store-products" id="storeProducts"></div>
    </div>
</div>

<nav class="floating-nav">
    <a href="customer.html" class="nav-item"><i class="ri-home-5-line"></i></a>
    <a href="shop.html" class="nav-item active"><i class="ri-store-2-line"></i></a>
    <a href="cart.html" class="nav-item"><i class="ri-shopping-cart-2-line"></i></a>
    <a href="profile.html" class="nav-item"><i class="ri-user-line"></i></a>
</nav>

<script>
// Improved Toast Function
function showToast(message){
    const toast = document.createElement("div");
    toast.innerText = message;
    toast.classList.add("toast");
    document.body.appendChild(toast);
    
    // Trigger reflow for animation
    void toast.offsetWidth;
    toast.classList.add("show");
    
    setTimeout(() => { 
        toast.classList.remove("show"); 
        setTimeout(() => toast.remove(), 400); 
    }, 2800);
}

const stores = {
    burger: {
        display: "Burger King",
        workerEmail: "madukwevictor2022@gmail.com",
        products:[
            {name:'Whopper', price:3500, img:'burger.webp'},
            {name:'Cheese Burger', price:2500, img:'cheeseburger.jpg'},
            {name:'Veggie Burger', price:2000, img:'veggie burger.jpg'}
        ]
    },
    pizza: {
        display: "Pizza Hut",
        workerEmail: "madukwevictor2024@gmail.com",
        products:[
            {name:'Pepperoni Pizza', price:4000, img:'pepperoni.jpg'},
            {name:'Veggie Pizza', price:3500, img:'veggie pizza.jpg'}
        ]
    },
    kfc: {
        display: "KFC",
        workerEmail: "madukwevictor117@gmail.com", // ✅ MATCHED
        products:[
            {name:'KFC Bucket', price:5000, img:'kfcbucket.jpg'},
            {name:'KFC Wings', price:2000, img:'kfcwings.jpg'}
        ]
    },
    chicken: {
        display: "Chicken Republic",
        workerEmail: "islaspoofed@gmail.com", // ✅ MATCHED
        products:[
            {name:'Fried Chicken', price:2500, img:'friedchicken.jpg'},
            {name:'Grilled Chicken', price:3000, img:'grilledchicken.jpg'}
        ]
    }
};

function openStoreModal(storeKey){
    const store = stores[storeKey];
    const modal = document.getElementById('storeModal');
    const container = document.getElementById('storeProducts');
    document.getElementById('storeTitle').innerText = store.display;
    container.innerHTML = '';
    modal.classList.add('show');

    store.products.forEach((product)=>{
        const div = document.createElement('div');
        div.classList.add('item');
        div.innerHTML = `
            <img src="${product.img}" alt="${product.name}">
            <div class="item-info">
                <h4>${product.name}</h4>
                <p>₦${product.price.toLocaleString()}</p>
            </div>
            <div class="qty-control">
                <button class="minus">−</button>
                <span class="qty">1</span>
                <button class="plus">+</button>
            </div>
            <button class="add-cart-btn">Add</button>
        `;

        const qtySpan = div.querySelector('.qty');
        div.querySelector('.plus').onclick = () => qtySpan.textContent = parseInt(qtySpan.textContent) + 1;
        div.querySelector('.minus').onclick = () => { if(parseInt(qtySpan.textContent) > 1) qtySpan.textContent = parseInt(qtySpan.textContent) - 1 };
        
        div.querySelector('.add-cart-btn').onclick = () => {
            addToCart(product, store.display, store.workerEmail, parseInt(qtySpan.textContent));
        };

        container.appendChild(div);
    });
}

function addToCart(product, storeName, workerEmail, quantity) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length > 0) {
        const currentStoreInCart = cart[0].storeName;
        if (storeName !== currentStoreInCart) {
            showToast(`⚠️ Clear your cart from ${currentStoreInCart} to order from ${storeName}`);
            return;
        }
    }

    const existingItemIndex = cart.findIndex(item => item.name === product.name && item.storeName === storeName);

    if (existingItemIndex > -1) {
        cart[existingItemIndex].quantity += quantity;
    } else {
        const newItem = {
            name: product.name,
            price: product.price,
            img: product.img,
            storeName: storeName,
            storeEmail: workerEmail, // ✅ FIXED (IMPORTANT)
            quantity: quantity
        };
        cart.push(newItem);
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    showToast(`${product.name} added! 🛒`);
}

function closeStore(){ document.getElementById('storeModal').classList.remove('show'); }

function filterProducts(){
    const input = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.store-card').forEach(card => {
        const title = card.querySelector('h3').textContent.toLowerCase();
        card.style.display = title.includes(input) ? '' : 'none';
    });
}
</script>
</body>
</html>
