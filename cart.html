<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilldash | Cart</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --radius: 16px;
}

/* Reset & Body */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background: var(--bg); 
    color: var(--text-main);
    padding-bottom: 120px; /* for floating nav */
}

/* Header */
.header-section {
    background: var(--surface);
    padding: 20px 6%;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-section h1 {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--primary);
}

/* Cart Items */
.cart-container {
    padding: 24px 6%;
}

.cart-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
}

.cart-item img {
    width: 70px;
    height: 70px;
    border-radius: 8px;
    object-fit: cover;
}

.cart-info { flex: 1; }
.cart-info h4 { font-size: 0.95rem; margin-bottom: 2px; }
.cart-info p { color: var(--primary); font-weight: 700; font-size: 0.9rem; }

.qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f1f5f9;
    padding: 4px;
    border-radius: 8px;
}

.qty-control button {
    width: 28px;
    height: 28px;
    border: none;
    background: var(--surface);
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: var(--shadow-sm);
}

.remove-btn {
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
}

/* Total & Checkout */
.cart-total {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 1.1rem;
}

.checkout-btn {
    margin-top: 12px;
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 12px;
    width: 100%;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
}

/* Floating Nav (same as shop) */
.floating-nav {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    padding: 12px 24px;
    border-radius: 50px;
    display: flex;
    gap: 32px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255,255,255,0.5);
    z-index: 999;
}

.nav-item { color: var(--text-muted); font-size: 1.5rem; }
.nav-item.active { color: var(--primary); }

/* Toast */
.toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    color: #fff;
    padding: 12px 24px;
    border-radius: 50px; 
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 2000;
    opacity: 0;
    transition: 0.3s;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
    white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

@media(max-width: 480px) {
    .cart-container { padding: 16px; }
}
</style>
</head>
<body>

<header class="header-section">
    <h1>My Cart</h1>
</header>

<div class="cart-container" id="cartContainer"></div>

<div class="cart-total" id="cartTotal">
    <span>Total:</span>
    <span>₦0</span>
</div>
<button class="checkout-btn" onclick="checkout()">Checkout</button>

<nav class="floating-nav">
    <a href="customer.html" class="nav-item"><i class="ri-home-5-line"></i></a>
    <a href="shop.html" class="nav-item"><i class="ri-store-2-line"></i></a>
    <a href="cart.html" class="nav-item active"><i class="ri-shopping-cart-2-line"></i></a>
    <a href="profile.html" class="nav-item"><i class="ri-user-line"></i></a>
</nav>

<script>
// Toast function
function showToast(message){
    const toast = document.createElement("div");
    toast.innerText = message;
    toast.classList.add("toast");
    document.body.appendChild(toast);
    void toast.offsetWidth;
    toast.classList.add("show");
    setTimeout(() => { 
        toast.classList.remove('show'); 
        setTimeout(() => toast.remove(), 400);
    }, 2800);
}

// Load cart from localStorage
function loadCart() {
    const cartContainer = document.getElementById('cartContainer');
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    cartContainer.innerHTML = '';

    let total = 0;

    cart.forEach((item, index) => {
        total += item.price * item.quantity;

        const div = document.createElement('div');
        div.classList.add('cart-item');
        div.innerHTML = `
            <img src="${item.img}" alt="${item.name}">
            <div class="cart-info">
                <h4>${item.name}</h4>
                <p>₦${item.price.toLocaleString()}</p>
            </div>
            <div class="qty-control">
                <button class="minus">−</button>
                <span class="qty">${item.quantity}</span>
                <button class="plus">+</button>
            </div>
            <button class="remove-btn">Remove</button>
        `;

        const qtySpan = div.querySelector('.qty');

        div.querySelector('.plus').onclick = () => {
            item.quantity++;
            qtySpan.textContent = item.quantity;
            saveCart(cart);
            updateTotal(cart);
        };
        div.querySelector('.minus').onclick = () => {
            if(item.quantity > 1){
                item.quantity--;
                qtySpan.textContent = item.quantity;
                saveCart(cart);
                updateTotal(cart);
            }
        };
        div.querySelector('.remove-btn').onclick = () => {
            cart.splice(index, 1);
            saveCart(cart);
            loadCart();
            showToast(`${item.name} removed`);
        };

        cartContainer.appendChild(div);
    });

    updateTotal(cart);
}

function saveCart(cart){
    localStorage.setItem('cart', JSON.stringify(cart));
}

function updateTotal(cart){
    const total = cart.reduce((sum, item)=> sum + item.price * item.quantity, 0);
    document.getElementById('cartTotal').querySelector('span:last-child').textContent = `₦${total.toLocaleString()}`;
}

function checkout(){
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    if(cart.length === 0){
        showToast("Cart is empty!");
        return;
    }
    // Here you can send cart to backend
    localStorage.removeItem('cart');
    loadCart();
    showToast("Order placed successfully! 🎉");
}

// Initial load
loadCart();
</script>
</body>
</html>
