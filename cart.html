<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hilldash | Your Cart</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --success: #22c55e;
    --danger: #ef4444;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
}

/* ... keep all your previous CSS ... */
</style>
</head>
<body>

<header class="top-navbar">
    <div class="logo">Hilldash</div>
</header>

<main class="cart-container">
    <div class="cart-card">
        <h2>Your Cart</h2>
        <div id="cartItemsContainer"></div>
    </div>

    <div class="cart-card" style="height: fit-content; position: sticky; top: 100px;">
        <h2>Order Summary</h2>
        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">₦0</span>
        </div>
        <div class="summary-row">
            <span>Shipping Fee</span>
            <span id="shipping">₦0</span>
        </div>
        <div class="summary-row summary-total">
            <span>Total</span>
            <span id="total">₦0</span>
        </div>
        <button class="checkout-btn" id="openPayment">Proceed to Checkout</button>
        <p id="errorNote" style="color: var(--danger); font-size: 0.75rem; font-weight: 700; text-align: center; margin-top: 10px; display: none;">Multiple restaurants detected. Please clear cart.</p>
    </div>
</main>

<nav class="floating-nav">
    <a href="customer.html" class="nav-item"><i class="ri-home-5-line"></i></a>
    <a href="shop.html" class="nav-item"><i class="ri-store-2-line"></i></a>
    <a href="cart.html" class="nav-item active"><i class="ri-shopping-cart-2-line"></i></a>
    <a href="profile.html" class="nav-item"><i class="ri-user-line"></i></a>
</nav>

<div class="modal" id="paymentModal">
    <div class="modal-content">
        <h2>Checkout Info</h2>
        <input type="text" id="customerName" placeholder="Full Name">
        <input type="email" id="customerEmail" placeholder="Email Address">
        <input type="tel" id="customerPhone" placeholder="Phone Number">
        <textarea id="deliveryAddress" placeholder="Delivery Address" rows="3"></textarea>
        
        <p style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">SELECT PAYMENT METHOD</p>
        <div class="payment-btns">
            <button class="pay-btn" id="payTransfer">Pay Online</button>
            <button class="pay-btn" id="payCash">Pay on Delivery</button>
        </div>
        <button id="closePayment" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:15px; cursor:pointer;">Cancel</button>
    </div>
</div>

<div class="modal" id="confirmModal">
    <div class="modal-content" style="text-align: center;">
        <i class="ri-information-line" style="font-size: 3rem; color: #fbbf24;"></i>
        <h3>Pay with Cash?</h3>
        <p style="color: var(--text-muted); margin: 10px 0 20px;">You will pay the courier upon delivery.</p>
        <div class="payment-btns">
            <button class="pay-btn" id="confirmYes" style="background:var(--success); color:white;">Confirm Order</button>
            <button class="pay-btn" id="confirmNo" style="background:var(--bg); color:var(--text-main);">Back</button>
        </div>
    </div>
</div>

<script>
const BACKEND_URL = "https://hilldashcorp.onrender.com/api";

document.addEventListener("DOMContentLoaded", () => {
    const cartContainer = document.getElementById("cartItemsContainer");
    const subtotalEl = document.getElementById("subtotal");
    const shippingEl = document.getElementById("shipping");
    const totalEl = document.getElementById("total");
    const paymentModal = document.getElementById("paymentModal");
    const confirmModal = document.getElementById("confirmModal");
    const checkoutBtn = document.getElementById("openPayment");
    const errorNote = document.getElementById("errorNote");
    const addressField = document.getElementById("deliveryAddress");

    let selectedPayment = null;

    function autoFill() {
        const user = JSON.parse(localStorage.getItem("user")) || {};
        const savedAddress = localStorage.getItem("userAddress");
        if (user.name) document.getElementById("customerName").value = user.name;
        if (user.email) document.getElementById("customerEmail").value = user.email;
        if (savedAddress) addressField.value = savedAddress;
    }

    function showToast(msg){
        const toast = document.createElement("div");
        toast.innerText = msg;
        toast.className = "toast show";
        document.body.appendChild(toast);
        setTimeout(() => { toast.classList.remove("show"); setTimeout(()=>toast.remove(), 400); }, 2500);
    }

    function getCart() {
        const stored = localStorage.getItem("cart");
        return stored ? JSON.parse(stored) : [];
    }

    function loadCart(){
        const cart = getCart();
        cartContainer.innerHTML = "";
        
        if(cart.length === 0){
            cartContainer.innerHTML = `<div style="text-align:center; padding: 40px 0;"><p style="color:#64748b;">Your cart is empty.</p></div>`;
            checkoutBtn.disabled = true;
            updateTotals();
            return;
        }

        // Integrity Check: only 1 store
        const stores = [...new Set(cart.map(item => item.storeName))];
        if (stores.length > 1) {
            checkoutBtn.disabled = true;
            errorNote.style.display = "block";
        } else {
            checkoutBtn.disabled = false;
            errorNote.style.display = "none";
        }

        cart.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "cart-item";
            div.innerHTML = `
                <div class="item-details">
                    <h4>${item.name}</h4>
                    <p>₦${item.price.toLocaleString()} <span class="store-badge">${item.storeName}</span></p>
                </div>
                <div class="item-actions">
                    <div class="qty-pill">
                        <button onclick="changeQty(${index}, -1)">-</button>
                        <span>${item.quantity || 1}</span>
                        <button onclick="changeQty(${index}, 1)">+</button>
                    </div>
                    <i class="ri-delete-bin-line remove-icon" onclick="removeItem(${index})"></i>
                </div>`;
            cartContainer.appendChild(div);
        });
        updateTotals();
    }

    window.changeQty = (index, delta) => {
        let cart = getCart();
        cart[index].quantity = Math.max(1, (cart[index].quantity || 1) + delta);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    };

    window.removeItem = (index) => {
        let cart = getCart();
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    };

    function updateTotals(){
        const cart = getCart();
        const subtotal = cart.reduce((acc, i) => acc + (i.price * (i.quantity || 1)), 0);
        const shipping = cart.length > 0 ? 500 : 0;
        subtotalEl.innerText = "₦" + subtotal.toLocaleString();
        shippingEl.innerText = "₦" + shipping.toLocaleString();
        totalEl.innerText = "₦" + (subtotal + shipping).toLocaleString();
        return subtotal + shipping;
    }

    checkoutBtn.onclick = () => paymentModal.style.display = "flex";
    document.getElementById("closePayment").onclick = () => paymentModal.style.display = "none";
    document.getElementById("payCash").onclick = () => { paymentModal.style.display = "none"; confirmModal.style.display = "flex"; };
    document.getElementById("confirmNo").onclick = () => confirmModal.style.display = "none";

    async function sendOrder(reference, total) {
        const cart = getCart();
        if (!cart.length) return showToast("Your cart is empty ❌");

        const name = document.getElementById("customerName").value.trim();
        const email = document.getElementById("customerEmail").value.trim();
        const phone = document.getElementById("customerPhone").value.trim();
        const address = document.getElementById("deliveryAddress").value.trim();

        if(!name || !email || !address || !phone) return showToast("Please fill all details");

        const orderData = {
            customerName: name,
            customerEmail: email,
            customerPhone: phone,
            deliveryAddress: address,
            items: cart.map(i => ({ ...i, quantity: i.quantity || 1 })), // ensure quantity exists
            total: total,
            paymentMethod: selectedPayment,
            status: "pending",
            storeName: cart[0].storeName || "Unknown Store",
            assignedWorkerEmail: cart[0].storeEmail || ""
        };

        try {
            const response = await fetch(`${BACKEND_URL}/orders`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderData)
            });

            if(response.ok) {
                showToast("Order placed! ✅");
                localStorage.removeItem("cart");
                localStorage.setItem("userAddress", address);
                setTimeout(() => { window.location.href = "profile.html"; }, 1500);
            } else {
                const errData = await response.json();
                showToast(errData.message || "Order failed ❌");
            }
        } catch (error) {
            console.error("Submission error:", error);
            showToast("Server error ❌");
        }
    }

    document.getElementById("payTransfer").onclick = () => {
        const total = updateTotals();
        selectedPayment = "bank_transfer";
        const emailValue = document.getElementById("customerEmail").value.trim();
        if(!emailValue) return showToast("Enter your email for payment");
        const handler = PaystackPop.setup({
            key: "pk_live_68b9c6fcb4aa268d863ae64c7b3dba0e0c5d4dbd",
            email: emailValue,
            amount: total * 100,
            currency: "NGN",
            callback: (res) => sendOrder(res.reference, total),
            onClose: () => showToast("Payment cancelled")
        });
        handler.openIframe();
    };

    document.getElementById("confirmYes").onclick = () => {
        const totalAmount = updateTotals();
        selectedPayment = "cash";
        confirmModal.style.display = "none";
        sendOrder("CASH-" + Date.now(), totalAmount);
    };

    loadCart();
    autoFill();
});
</script>
</body>
</html>
