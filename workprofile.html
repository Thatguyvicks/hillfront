<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilldash | Worker Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }

        /* ===== SIDEBAR ===== */
        aside {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: fixed;
            height: 100vh;
        }

        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 8px; }
        
        nav { flex: 1; }
        nav a { 
            display: flex; align-items: center; padding: 12px 16px; 
            text-decoration: none; color: var(--text-muted); 
            font-weight: 500; border-radius: 8px; margin-bottom: 4px; transition: 0.2s;
            gap: 12px;
        }
        nav a i { font-size: 1.2rem; }
        nav a.active { background: #eff6ff; color: var(--primary); }
        nav a:hover:not(.active) { background: #f1f5f9; color: var(--text-main); }

        /* ===== MAIN CONTENT ===== */
        main { flex: 1; margin-left: 260px; padding: 32px; display: flex; flex-direction: column; align-items: center; }

        .profile-wrapper { width: 100%; max-width: 550px; }

        header { width: 100%; margin-bottom: 32px; text-align: left; }
        header h1 { font-size: 1.5rem; font-weight: 700; }

        /* Profile Card */
        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 32px;
        }

        .profile-header-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 auto 12px;
        }

        .info-field { margin-bottom: 20px; }
        .info-field label { 
            display: block; font-size: 0.75rem; font-weight: 700; 
            color: var(--text-muted); text-transform: uppercase; 
            letter-spacing: 0.05em; margin-bottom: 6px;
        }
        .static-text { 
            font-size: 1rem; font-weight: 500; color: var(--text-main); 
            padding: 8px 0; border-bottom: 1px solid #f1f5f9;
        }

        input {
            width: 100%; padding: 12px 16px; border-radius: 8px;
            border: 1px solid var(--border); font-size: 1rem;
            transition: 0.2s; background: #fcfcfc;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* Buttons */
        .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
        .btn {
            padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.95rem; border: 1px solid transparent; transition: 0.2s;
        }
        .btn-save { background: var(--primary); color: white; }
        .btn-save:hover { background: var(--primary-hover); }
        .btn-logout { background: transparent; color: var(--danger); border-color: #fee2e2; }
        .btn-logout:hover { background: #fee2e2; }

        /* Toast */
        .toast {
            position: fixed; bottom: 32px; right: 32px; background: #1e293b; color: #fff;
            padding: 16px 24px; border-radius: 10px; opacity: 0; transform: translateY(20px);
            transition: 0.3s; z-index: 9999; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media(max-width: 1024px) {
            aside { display: none; }
            main { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

<aside>
    <div class="logo">📦 Hilldash</div>
    <nav>
        <a href="worker.html"><i class="ri-dashboard-line"></i> Dashboard</a>
        <a href="#" class="active"><i class="ri-user-settings-line"></i> Profile Settings</a>
        <a href="#"><i class="ri-question-line"></i> Help Center</a>
    </nav>
    <div style="margin-top: auto; font-size: 0.8rem; color: var(--text-muted);">
        Logged in as <br><strong id="sideUserMail" style="color: var(--text-main);">worker@mail.com</strong>
    </div>
</aside>

<main>
    <div class="profile-wrapper">
        <header>
            <h1>Account Settings</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Manage your profile and contact information.</p>
        </header>

        <div class="profile-card">
            <div class="profile-header-area">
                <div class="avatar-circle" id="avatarLetter">W</div>
                <h2 id="displayName" style="font-size: 1.25rem;">Worker Name</h2>
                <span style="font-size: 0.85rem; color: var(--text-muted);">Delivery Professional</span>
            </div>

            <div class="info-field">
                <label>Full Name</label>
                <div class="static-text" id="workerName">-</div>
            </div>

            <div class="info-field">
                <label>Email Address</label>
                <div class="static-text" id="workerEmail">-</div>
            </div>

            <div class="info-field">
                <label>Phone Number</label>
                <input type="text" id="workerPhone" placeholder="Enter phone number">
            </div>

            <div class="actions">
                <button class="btn btn-save" id="saveBtn">
                    <i class="ri-save-line"></i> Save Changes
                </button>
                <button class="btn btn-logout" id="logoutBtn">
                    <i class="ri-logout-circle-r-line"></i> Logout
                </button>
            </div>
        </div>
    </div>
</main>

<script>
    // ===== LOAD USER DATA =====
    const user = JSON.parse(localStorage.getItem("user")) || { 
        name: "Worker User", 
        email: "worker@hilldash.com",
        phone: "",
        role: "worker" 
    };

    // Update UI elements
    document.getElementById("sideUserMail").innerText = user.email;
    document.getElementById("workerName").innerText = user.name || "N/A";
    document.getElementById("displayName").innerText = user.name || "Worker Name";
    document.getElementById("workerEmail").innerText = user.email;
    document.getElementById("workerPhone").value = user.phone || "";
    document.getElementById("avatarLetter").innerText = (user.name || "W").charAt(0).toUpperCase();

    // ===== TOAST FUNCTION =====
    function showToast(msg) {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add("show"), 50);
        setTimeout(() => {
            t.classList.remove("show");
            setTimeout(() => t.remove(), 500);
        }, 2500);
    }

    // ===== SAVE LOGIC =====
    document.getElementById("saveBtn").addEventListener("click", () => {
        user.phone = document.getElementById("workerPhone").value;
        localStorage.setItem("user", JSON.stringify(user));
        showToast("Profile updated successfully ✨");
    });

    // ===== LOGOUT LOGIC =====
    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("user");
        window.location.href = "index.html";
    });
</script>

</body>
</html>
