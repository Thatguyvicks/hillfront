<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilldash | My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding-bottom: 100px;
        }

        /* Header */
        .top-navbar {
            background: #fff;
            padding: 1.2rem 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

        /* Main Layout */
        .profile-container {
            max-width: 600px;
            margin: 24px auto;
            padding: 0 20px;
            display: grid;
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-group label { 
            display: block; 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        /* Buttons */
        .btn-group { display: flex; gap: 12px; margin-top: 10px; }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #fee2e2; color: var(--danger); }

        /* Order List */
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .order-item:last-child { border-bottom: none; }
        .order-info b { display: block; font-size: 0.95rem; }
        .order-info small { color: var(--text-muted); font-size: 0.8rem; }

        /* Status Badges - Matching Courier Dashboard */
        .status-badge {
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .status-pending { background: #fef3c7; color: #92400e; } /* Orange */
        .status-out_for_delivery { background: #e0f2fe; color: #075985; } /* Blue */
        .status-delivered { background: #dcfce7; color: #166534; } /* Green */
        .status-cancelled { background: #fee2e2; color: #991b1b; } /* Red */

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-box {
            background: var(--bg-body);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-box span { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); display: block; }
        .stat-box b { font-size: 1.1rem; }

        /* Login as Courier Button */
        .courier-btn {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: var(--primary-dark);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: 0.2s;
        }
        .courier-btn:hover { background: var(--primary); }

        /* Nav */
        .floating-nav {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);
            padding: 12px 24px; border-radius: 50px; display: flex; gap: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border); z-index: 99;
        }
        .nav-item { color: var(--text-muted); font-size: 1.4rem; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<header class="top-navbar">
    <div class="logo">Hilldash</div>
</header>

<div class="profile-container">
    <div class="card">
        <h2><i class="ri-user-smile-line"></i> Profile Details</h2>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="customerName">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="customerEmail" readonly style="background: #f1f5f9;">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="customerPhone">
        </div>
        <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" id="customerAddress">
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="updateProfile()">Update Profile</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin-bottom: 0;"><i class="ri-moped-line"></i> Recent Orders</h2>
            <button onclick="fetchLiveOrders()" style="border:none; background:none; color:var(--primary); font-weight:700; cursor:pointer; font-size: 0.8rem;">Refresh</button>
        </div>
        <div id="ordersList">
            <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading orders...</p>
        </div>
    </div>

    <div class="card">
        <h2><i class="ri-pie-chart-line"></i> Summary</h2>
        <div class="stats-grid">
            <div class="stat-box">
                <span>Total Spent</span>
                <b id="statSpent">₦0</b>
            </div>
            <div class="stat-box">
                <span>Completed</span>
                <b id="statCount">0</b>
            </div>
        </div>

        <!-- Login as Courier Button -->
        <button class="courier-btn" onclick="window.location.href='login.html'">Login as Courier</button>
    </div>
</div>

<nav class="floating-nav">
    <a href="customer.html" class="nav-item"><i class="ri-home-5-line"></i></a>
    <a href="shop.html" class="nav-item"><i class="ri-store-2-line"></i></a>
    <a href="cart.html" class="nav-item"><i class="ri-shopping-cart-2-line"></i></a>
    <a href="profile.html" class="nav-item active"><i class="ri-user-line"></i></a>
</nav>

<script>
    const BACKEND_URL = "https://hilldashcorp.onrender.com/api";
    
    let user = JSON.parse(localStorage.getItem("user")) || {};

    document.addEventListener("DOMContentLoaded", () => {
        if (!user.email) {
            window.location.href = "login.html";
            return;
        }

        document.getElementById("customerName").value = user.name || "";
        document.getElementById("customerEmail").value = user.email || "";
        document.getElementById("customerPhone").value = user.phone || "";
        document.getElementById("customerAddress").value = user.address || "";

        fetchLiveOrders();
        setInterval(fetchLiveOrders, 30000);
    });

    async function fetchLiveOrders() {
        try {
            const response = await fetch(`${BACKEND_URL}/orders`);
            const allOrders = await response.json();
            const myOrders = allOrders.filter(o => o.customerEmail === user.email);
            myOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            renderOrders(myOrders.slice(0, 5));
            updateStats(myOrders);
        } catch (error) {
            console.error("Order sync error:", error);
            document.getElementById("ordersList").innerHTML = "<p style='color:red; text-align:center;'>Error loading orders.</p>";
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById("ordersList");
        if (orders.length === 0) {
            container.innerHTML = "<p style='text-align: center; color: var(--text-muted); padding: 20px;'>No orders yet. Start shopping!</p>";
            return;
        }

        container.innerHTML = orders.map(order => {
            const itemPreview = order.items && order.items.length > 0 
                ? (order.items.length > 1 ? `${order.items[0].name} + ${order.items.length - 1} more` : order.items[0].name)
                : "Delivery Task";
            const statusKey = order.status.toLowerCase();
            const statusLabel = order.status.replace(/_/g, ' ');
            return `
                <div class="order-item">
                    <div class="order-info">
                        <b>${itemPreview}</b>
                        <small>₦${order.total.toLocaleString()} • ${new Date(order.createdAt).toLocaleDateString()}</small>
                    </div>
                    <span class="status-badge status-${statusKey}">${statusLabel}</span>
                </div>
            `;
        }).join('');
    }

    function updateStats(orders) {
        const totalSpent = orders.filter(o => o.status === "delivered").reduce((acc, curr) => acc + curr.total, 0);
        const completedCount = orders.filter(o => o.status === "delivered").length;
        document.getElementById("statSpent").innerText = "₦" + totalSpent.toLocaleString();
        document.getElementById("statCount").innerText = completedCount;
    }

    function updateProfile() {
        const updatedUser = {
            ...user,
            name: document.getElementById("customerName").value,
            phone: document.getElementById("customerPhone").value,
            address: document.getElementById("customerAddress").value
        };
        localStorage.setItem("user", JSON.stringify(updatedUser));
        alert("Profile updated locally! ✅");
    }

    function logout() {
        localStorage.removeItem("user");
        window.location.href = "index.html";
    }
</script>
</body>
</html>
