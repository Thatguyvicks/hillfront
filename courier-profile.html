<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilldash | Courier Profile</title>
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-light: #f8fafc;
            --text-main: #0f172a;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-light); color: var(--text-main); padding-top: 100px; }

        /* --- SIDEBAR NAVIGATION --- */
        #sidebar {
            position: fixed; left: -300px; top: 0; width: 280px; height: 100%;
            background: #fff; z-index: 3000; transition: 0.4s ease;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1); padding: 25px;
        }
        #sidebar.open { left: 0; }
        .overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.4); display:none; z-index: 2500;
        }
        .nav-item { 
            display: flex; align-items: center; gap: 15px; padding: 15px; 
            border-radius: 12px; cursor: pointer; color: #64748b; font-weight: 600;
            margin-bottom: 5px; transition: 0.2s; text-decoration: none;
        }
        .nav-item:hover, .nav-item.active { background: #f1f5f9; color: var(--primary); }

        /* --- TOP BAR NAVIGATION --- */
        #topBar {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background: #fff;
            border-radius: 16px; z-index: 1000; 
            box-shadow: var(--card-shadow);
            border: 1px solid #f1f5f9;
        }
        .menu-btn { font-size: 24px; cursor: pointer; color: var(--text-main); }
        .page-title { font-weight: 800; color: var(--primary); font-size: 18px; }

        /* --- PROFILE CONTENT --- */
        .header { padding: 20px 20px 40px 20px; text-align: center; }
        .avatar { 
            width: 90px; height: 90px; background: var(--primary); color: #fff; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 36px; margin: 0 auto 15px auto; font-weight: 800;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2); 
        }
        
        .container { max-width: 500px; margin: 0 auto; padding: 0 20px; }
        .info-card { 
            background: #fff; padding: 25px; border-radius: 24px; 
            box-shadow: var(--card-shadow); margin-bottom: 20px;
            border: 1px solid #f1f5f9;
        }
        .info-item { margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
        .info-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .info-item label { font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-item p { font-size: 16px; font-weight: 600; margin-top: 6px; color: var(--text-main); }

        .logout-btn-wide { 
            width: 100%; padding: 18px; background: #fee2e2; color: #ef4444; 
            border: none; border-radius: 16px; font-weight: 700; cursor: pointer; 
            margin-top: 10px; transition: 0.3s;
        }
        .logout-btn-wide:hover { background: #fecaca; }

    </style>
</head>
<body>

<div id="sidebar">
    <div style="margin-bottom: 30px;">
        <h2 style="color: var(--primary);">Hilldash</h2>
        <p style="font-size: 12px; color: #64748b;">Courier Partner</p>
    </div>
    <a href="courier-profile.html" class="nav-item active"><i class="ri-user-line"></i> Profile</a>
    <a href="delivery-history.html" class="nav-item"><i class="ri-wallet-line"></i> Total Earnings</a>
    <a href="payment.html" class="nav-item"><i class="ri-bank-card-line"></i> Payout Method</a>
    
    <div class="nav-item" style="margin-top: 50px; color: var(--danger);" onclick="logout()">
        <i class="ri-logout-box-line"></i> Logout
    </div>
</div>

<div class="overlay" id="overlay"></div>

<div id="topBar">
    <i class="ri-menu-2-line menu-btn" id="openMenu"></i>
    <div class="page-title">My Profile</div>
    <div style="width: 24px;"></div> </div>

<div class="header">
    <div class="avatar" id="initials">...</div>
    <h2 id="displayName">Loading...</h2>
    <p id="displayEmail" style="color: #64748b; font-size: 14px; margin-top: 4px;">Loading...</p>
</div>

<div class="container">
    <div class="info-card">
        <div class="info-item">
            <label>Registered Vehicle</label>
            <p id="profVehicle">Fetching details...</p>
        </div>
        <div class="info-item">
            <label>Phone Number</label>
            <p id="profPhone">Fetching details...</p>
        </div>
        <div class="info-item">
            <label>Account Status</label>
            <p style="color: var(--success)">Verified Partner <i class="ri-checkbox-circle-fill"></i></p>
        </div>
    </div>

    <button class="logout-btn-wide" onclick="logout()">Logout Account</button>
</div>

<script>
    // --- SIDEBAR LOGIC ---
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    
    document.getElementById("openMenu").onclick = () => {
        sidebar.classList.add("open");
        overlay.style.display = "block";
    };

    overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.style.display = "none";
    };

    // --- AUTH & DATA LOGIC ---
    const courierEmail = localStorage.getItem("courierEmail") || sessionStorage.getItem("google_credential");

    if (!courierEmail) {
        window.location.href = "login.html";
    }

    const API = window.location.hostname === "localhost" 
        ? "https://hilldashcorp.onrender.com/api" 
        : "https://hilldashcorp.onrender.com/api";

    async function loadProfile() {
        try {
            const res = await fetch(`${API}/courier/applications`);
            const apps = await res.json();
            const myData = apps.find(a => a.email === courierEmail);

            if (myData) {
                document.getElementById("displayName").innerText = myData.name;
                document.getElementById("displayEmail").innerText = myData.email;
                document.getElementById("profVehicle").innerText = myData.vehicle || "Not Specified";
                document.getElementById("profPhone").innerText = myData.phone || "Not Provided";
                
                if (myData.name) {
                    document.getElementById("initials").innerText = myData.name.charAt(0).toUpperCase();
                }
            } else {
                document.getElementById("displayName").innerText = "Courier Partner";
                document.getElementById("displayEmail").innerText = courierEmail;
                document.getElementById("initials").innerText = "C";
            }
        } catch (err) {
            console.error("Profile load error:", err);
            document.getElementById("displayName").innerText = "Network Error";
        }
    }

    function logout() {
        localStorage.removeItem("courierEmail");
        sessionStorage.removeItem("google_credential");
        window.location.href = "login.html";
    }

    loadProfile();
</script>

</body>
</html>
